<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Para Ti ❤️</title>
  <style>
    body {
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      color: #fff;
    }
    .card {
      background: rgba(0,0,0,0.25);
      padding: 30px;
      border-radius: 20px;
      max-width: 400px;
    }
    h1 {
      font-size: 2.2em;
      margin-bottom: 10px;
    }
    p {
      font-size: 1.2em;
    }
    .heart {
      font-size: 3em;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Feliz San Valentín 💕</h1>
    <p>
      Mi amor, quiero que sepas que te amo con todo mi corazón.  
      Gracias por existir, por tu sonrisa y por hacer mi vida más bonita cada día.
    </p>
    <p>
      Siempre serás mi persona favorita ❤️
    </p>
    <div class="heart">💖💖💖</div>
  </div>
</body>
</html>
